<main class="app-shell">

<script>

 ['NEXO','Coordinador / filtro final','✦','blue','Cruza todo, elimina ruido y prepara la decisión final.'],

 ['Analistas Forecaster / Tato','YouTube','Vigilando','MLB','Autoría confirmada. Esperando extracción completa de mercado + cuota.'],

function eventCard(e,wide=false){return `<article class="event-card ${wide?'wide':''}" data-id="${e.id}"><div class="event-top"><span class="sport">${e.sport}</span><button class="status-btn" onclick="cycleStatus(${e.id})">${statusBadge(e.status)}</button></div><h4>${e.event}</h4><span class="event-time">${e.time}</span><div class="event-notes"><p>✓ <span>${e.consensus}</span></p><p>↔ <span>${e.conflict}</span></p></div><div class="event-foot">${pills(e.agents)}<button class="round">›</button></div></article>`}
function renderRadar(){const top=events.filter(e=>e.status==='fire').length,watch=events.filter(e=>e.status==='watch').length;document.querySelector('#radar').innerHTML=`
<section class="hero-card"><div class="hero-copy"><div class="hero-badge">⚡ NEXO — SIN CIERRE TODAVÍA</div><h2>El radar encuentra.<br><span>El equipo filtra.</span></h2><p>CazaCuotas no entra por ruido. Solo sube un evento cuando datos, mercado, contraste y voces externas aportan algo útil.</p><button class="primary" onclick="setTab('events')">Ver eventos ›</button></div><div class="hero-radar"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="sweep"></div><div class="radar-core">⌖</div><i class="blip b1"></i><i class="blip b2"></i><i class="blip b3"></i></div></section>
<section class="metrics"><div class="metric"><div class="metric-icon fire-bg">🔥</div><div><b>${top}</b><span>Fuertes</span></div></div><div class="metric"><div class="metric-icon blue-bg">👀</div><div><b>${watch}</b><span>En estudio</span></div></div><div class="metric"><div class="metric-icon gold-bg">◌</div><div><b>${tipsters.length}</b><span>Tipsters bajo lupa</span></div></div><div class="metric"><div class="metric-icon green-bg">✓</div><div><b>7</b><span>Agentes / roles</span></div></div></section>
<div class="section-head"><div><p class="eyebrow">PRIORIDAD</p><h3>Eventos que miramos</h3></div><button class="text-btn" onclick="setTab('events')">Ver todos</button></div><div class="event-grid">${events.slice(0,3).map(e=>eventCard(e)).join('')}</div>
<div class="section-head agents-head"><div><p class="eyebrow">EQUIPO</p><h3>Quién está trabajando</h3></div></div><div class="mini-agents">${agents.slice(0,5).map(a=>`<div class="mini-agent"><div class="agent-dot ${a[3]}">${a[2]}</div><div><b>${a[0]}</b><small>${a[1]}</small></div><span class="online"></span></div>`).join('')}</div>`}
function renderEvents(q=''){const filtered=events.filter(e=>(e.event+' '+e.sport).toLowerCase().includes(q.toLowerCase()));document.querySelector('#events').innerHTML=`<section class="toolbar-card"><div class="searchbox">⌕<input id="searchEvents" value="${q}" placeholder="Buscar evento o deporte..."></div><div class="legend">${Object.keys(statusMeta).map(statusBadge).join('')}</div></section><div class="section-head"><div><p class="eyebrow">SEMÁFORO NEXO</p><h3>Eventos separados</h3></div><span class="counter">${filtered.length} eventos</span></div><div class="event-list">${filtered.map(e=>eventCard(e,true)).join('')}</div><p class="hint">Toca el estado para cambiar FUERTE → ESTUDIAR → DUDAS → FUERA. <span class="save-pill">Se guarda en este dispositivo.</span></p>`;document.querySelector('#searchEvents').addEventListener('input',e=>renderEvents(e.target.value))}
function renderAgents(){document.querySelector('#agents').innerHTML=`<div class="section-head"><div><p class="eyebrow">ORGANIGRAMA OPERATIVO</p><h3>Cada agente, una función</h3></div></div><div class="agent-grid">${agents.map(a=>`<article class="agent-card"><div class="agent-icon ${a[3]}">${a[2]}</div><div class="agent-title"><h4>${a[0]}</h4><span class="online-label"><i></i> ACTIVO</span></div><b>${a[1]}</b><p>${a[4]}</p></article>`).join('')}</div><section class="flow-card"><span>LOLA descubre</span> › <span>PEPA mide mercado</span> › <span>MORENO desmonta</span> › <span>PACO contrasta</span> › <strong>NEXO cruza</strong> › <span>MIGUEL decide</span></section>`}
function renderPaco(){document.querySelector('#paco').innerHTML=`<section class="paco-hero"><div class="agent-icon violet big">◌</div><div><p class="eyebrow">AGENTE ESPECIAL</p><h3>PACO — rastreador de voces externas</h3><p>Busca, escucha, registra y pasa cuentas. Nunca copia por autoridad.</p></div><span class="monitor"><span class="live-dot"></span> MONITORIZANDO</span></section><div class="paco-kpis"><div><b>5+</b><span>Canales YouTube</span></div><div><b>2</b><span>Historiales sólidos</span></div><div><b>1h</b><span>Frecuencia radar</span></div><div><b>4</b><span>Etiquetas de fiabilidad</span></div></div><div class="section-head"><div><p class="eyebrow">EXPEDIENTES</p><h3>Pronosticadores vigilados</h3></div></div><div class="tipster-list">${tipsters.map(t=>`<article class="tipster"><div class="source-icon">${t[1]==='YouTube'?'▶':'★'}</div><div class="tip-main"><div><h4>${t[0]}</h4><span>${t[1]} · ${t[3]}</span></div><p>${t[4]}</p></div><span class="tip-state ${t[2]==='Historial'?'history':''}">${t[2]}</span></article>`).join('')}</div><section class="classification"><h4>Clasificación PACO</h4><div><span class="class-ok">RESULTADO VERIFICABLE</span><span class="class-auto">DATO AUTODECLARADO</span><span class="class-op">OPINIÓN</span><span class="class-ad">PUBLICIDAD / PATROCINIO</span></div></section>`}
function renderBank(){const bank=localStorage.getItem('cc-bank')||'', stake=localStorage.getItem('cc-stake')||'';document.querySelector('#bank').innerHTML=`<section class="bank-hero"><div><p class="eyebrow">CONTROL DE BANCA</p><h3>Decidir cuánto arriesgar empieza por saber cuánto hay.</h3><p>Esta primera versión guarda los cálculos solo en tu dispositivo. No realiza apuestas.</p></div><div style="font-size:52px;color:var(--gold)">€</div></section><div class="bank-grid"><div class="form-card"><label>Banca disponible (€)</label><input id="bankInput" inputmode="decimal" value="${bank}" placeholder="Ej. 2000"></div><div class="form-card"><label>Importe posible (€)</label><input id="stakeInput" inputmode="decimal" value="${stake}" placeholder="Ej. 50"></div><div class="risk-card"><span>Exposición</span><b id="riskValue">—</b><small>del total disponible</small></div></div><section class="bank-note">✓ <div><b>La app no apuesta por ti.</b><p>Los agentes aportan materia prima y contraste; la ejecución final sigue siendo humana.</p></div></section>`;['bankInput','stakeInput'].forEach(id=>document.getElementById(id).addEventListener('input',calcRisk));calcRisk()}
function calcRisk(){const b=document.getElementById('bankInput'),s=document.getElementById('stakeInput');if(!b||!s)return;const bv=parseFloat(b.value.replace(',','.')),sv=parseFloat(s.value.replace(',','.'));localStorage.setItem('cc-bank',b.value);localStorage.setItem('cc-stake',s.value);document.getElementById('riskValue').textContent=bv>0&&sv>=0?((sv/bv)*100).toFixed(2)+'%':'—'}
function cycleStatus(id){const order=['fire','watch','warn','out'];events=events.map(e=>e.id===id?{...e,status:order[(order.indexOf(e.status)+1)%order.length]}:e);localStorage.setItem('cc-events',JSON.stringify(events));renderRadar();renderEvents(document.getElementById('searchEvents')?.value||'')}
function setTab(id){tabs.forEach(t=>document.getElementById(t[0]).classList.toggle('hidden',t[0]!==id));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));document.getElementById('pageTitle').textContent=tabs.find(t=>t[0]===id)[1];if(id==='bank')renderBank();window.scrollTo({top:0,behavior:'smooth'})}
function initNav(){const navHtml=tabs.map(t=>`<button data-tab="${t[0]}" class="${t[0]==='radar'?'active':''}" onclick="setTab('${t[0]}')"><span class="ico">${t[2]}</span><span>${t[1]}</span></button>`).join('');document.getElementById('sideNav').innerHTML=navHtml;document.getElementById('bottomNav').innerHTML=navHtml}
initNav();renderRadar();renderEvents();renderAgents();renderPaco();renderBank();
</script>
</body>
</html>
